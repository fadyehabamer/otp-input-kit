name: Bug report
description: Something in otp-input-kit behaves or renders incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A minimal reproduction (CodePen, StackBlitz or a short HTML file) is the most helpful thing you can include.
        Security problems should be reported privately instead; see [SECURITY.md](https://github.com/fadyehabamer/otp-input-kit/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include a link or a small snippet if you can.
      placeholder: |
        1. Create the input with the options below
        2. Paste "123 456" into the first cell
        3. ...
    validations:
      required: true
  - type: dropdown
    id: wrapper
    attributes:
      label: Framework / wrapper
      options:
        - Vanilla JS (OTPInput.create)
        - Web Component (<otp-input>)
        - React (otp-input-kit/react)
        - Vue (otp-input-kit/vue)
        - Svelte (otp-input-kit/svelte)
        - Angular (otp-input-kit/angular)
        - UMD / CDN script tag
    validations:
      required: true
  - type: input
    id: framework-version
    attributes:
      label: Framework version
      placeholder: e.g. React 19.1, Vue 3.5, Svelte 5.2, Angular 19
  - type: textarea
    id: options
    attributes:
      label: Options
      description: The options object or `<otp-input>` attributes you used.
      render: js
      placeholder: |
        OTPInput.create('#otp', { length: 6, type: 'numeric', direction: 'rtl', locale: 'ar', nativeNumerals: true })
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: otp-input-kit version
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      description: Include the device for mobile, and the keyboard app if it involves SMS suggestions or input.
      placeholder: e.g. Chrome 128 on Android 15 (Gboard), Safari on iOS 18
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Direction
      options:
        - LTR
        - RTL
        - Both
        - Not relevant
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, screen reader used, etc.
